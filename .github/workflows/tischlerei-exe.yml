# Baut die Windows-Version (Tischlerei-Kalkulation.exe) und stellt sie als ZIP bereit.
#  - bei jedem Push, der kalkulation/ ändert: Download unter Actions → Lauf → Artifacts
#  - bei einem Tag v* (z. B. v1.0.0): zusätzlich als GitHub-Release
name: Tischlerei-Kalkulation (Windows-exe)

on:
  push:
    paths: ["kalkulation/**", ".github/workflows/tischlerei-exe.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kalkulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kalkulation/requirements*.txt
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: exe bauen
        run: pyinstaller --noconfirm tischlerei.spec
      - name: Start-Test der exe
        shell: pwsh
        run: |
          $env:TISCHLEREI_DATEN = "$env:RUNNER_TEMP\testdaten"
          $p = Start-Process -FilePath "dist\Tischlerei-Kalkulation\Tischlerei-Kalkulation.exe" -ArgumentList "--kein-browser","--port","8123" -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-RestMethod -Method Post -Uri http://localhost:8123/api/projekte -ContentType "application/json" -Body '{"name":"CI","beispiel":true}'
          Invoke-WebRequest -Uri "http://localhost:8123/api/projekte/$($r.id)/export/modell.step" -OutFile step.step
          Invoke-WebRequest -Uri "http://localhost:8123/api/projekte/$($r.id)/export/angebot.pdf" -OutFile angebot.pdf
          if ((Get-Item step.step).Length -lt 10000) { throw "STEP-Export fehlgeschlagen" }
          Stop-Process -Id $p.Id -Force
      - name: ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path dist\Tischlerei-Kalkulation -DestinationPath Tischlerei-Kalkulation-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tischlerei-Kalkulation-Windows
          path: kalkulation/Tischlerei-Kalkulation-Windows.zip
          retention-days: 30
      - name: Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kalkulation/Tischlerei-Kalkulation-Windows.zip
